version: "3.9"

services:
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: deadtrip-backend-container
    ports:
      - "3000:3000"
    env_file:
      - ./Server/.env

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: deadtrip-frontend-container
    ports:
      - "5173:80"
    depends_on:
      - backend